    <script>
      (function() {
        try {
          const testKey = '__storage_test__';
          window.localStorage.setItem(testKey, testKey);
          window.localStorage.removeItem(testKey);
        } catch (e) {
          console.warn("Storage access restricted. Implementing safe fallback.", e);
          let inMemoryStorage = {};
          const mockStorage = {
            getItem: function(key) { return key in inMemoryStorage ? inMemoryStorage[key] : null; },
            setItem: function(key, value) { inMemoryStorage[key] = String(value); },
            removeItem: function(key) { delete inMemoryStorage[key]; },
            clear: function() { inMemoryStorage = {}; },
            key: function(i) { return Object.keys(inMemoryStorage)[i] || null; },
            get length() { return Object.keys(inMemoryStorage).length; }
          };
          try {
            Object.defineProperty(window, 'localStorage', {
              value: mockStorage,
              configurable: true,
              enumerable: true,
              writable: true
            });
            Object.defineProperty(window, 'sessionStorage', {
              value: mockStorage,
              configurable: true,
              enumerable: true,
              writable: true
            });
          } catch (defineError) {
            if (typeof Storage !== 'undefined') {
              try {
                const origGetItem = Storage.prototype.getItem;
                const origSetItem = Storage.prototype.setItem;
                const origRemoveItem = Storage.prototype.removeItem;
                const origClear = Storage.prototype.clear;

                Storage.prototype.getItem = function(key) {
                  try { return origGetItem.call(this, key); } catch (err) { return key in inMemoryStorage ? inMemoryStorage[key] : null; }
                };
                Storage.prototype.setItem = function(key, value) {
                  try { origSetItem.call(this, key, value); } catch (err) { inMemoryStorage[key] = String(value); }
                };
                Storage.prototype.removeItem = function(key) {
                  try { origRemoveItem.call(this, key); } catch (err) { delete inMemoryStorage[key]; }
                };
                Storage.prototype.clear = function() {
                  try { origClear.call(this); } catch (err) { inMemoryStorage = {}; }
                };
              } catch (protoError) {
                console.error("Could not patch Storage prototype:", protoError);
              }
            }
          }
        }
      })();
    </script>
    <script>
      (function() {
        try {
          if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
          }

  <body class="bg-slate-50 dark:bg-[#0a0a0a]">
    <script>
      const isDev = window.location.hostname === 'localhost' || 
                    window.location.hostname === '127.0.0.1' || 
                    localStorage.getItem('debug') === 'true';

      window.addEventListener('error', function(e) {
        console.error('Captured Global Error:', e);
        if (isDev) {
          document.body.innerHTML += '<div style="position:fixed;top:0;left:0;right:0;background:red;color:white;z-index:99999;padding:20px;font-family:monospace;white-space:pre-wrap;">' + e.message + '\n' + e.filename + ':' + e.lineno + '\n' + (e.error && e.error.stack ? e.error.stack : '') + '</div>';
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        console.error('Captured Unhandled Rejection:', e);
        if (isDev) {
          document.body.innerHTML += '<div style="position:fixed;top:0;left:0;right:0;background:red;color:white;z-index:99999;padding:20px;font-family:monospace;white-space:pre-wrap;">Unhandled Promise Rejection: ' + (e.reason && e.reason.stack ? e.reason.stack : e.reason) + '</div>';
        }
      });
    </script>
